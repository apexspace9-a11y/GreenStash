name: Android CI

on:
  push:
    branches: [ "main", "mocquy-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build release and installable APKs
        run: ./gradlew assembleRelease assembleSideload
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MocQuy-Android-Installable
          path: app/build/outputs/apk/sideload/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: MocQuy-Android-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
