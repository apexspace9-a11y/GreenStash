import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id "com.mikepenz.aboutlibraries.plugin.android" version "15.0.3"
}

android {
    namespace 'com.starry.greenstash'
    compileSdk = 37

    defaultConfig {
        applicationId "com.apexspace.mocquy"
        minSdk 24
        targetSdk 37
        versionCode 500
        versionName "5.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
        ksp { arg('room.schemaLocation', "$projectDir/schemas") }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    output.outputFileName = "MocQuy-v${variant.versionName}.apk"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose true
        buildConfig = true
    }

    composeCompiler { enableStrongSkippingMode = true }

    packagingOptions {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }

    androidResources { generateLocaleConfig true }

    lint {
        abortOnError true
        disable "LocalContextGetResourceValueCall"
        disable "MissingTranslation"
    }
}

kotlin {
    compilerOptions { jvmTarget.set(JvmTarget.JVM_17) }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.material3:material3"
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'

    //noinspection GradleDependency
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    androidTestImplementation "androidx.room:room-testing:$room_version"

    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation "androidx.hilt:hilt-navigation-compose:1.4.0"
    implementation "androidx.hilt:hilt-work:1.4.0"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"
    ksp "androidx.hilt:hilt-compiler:1.4.0"

    implementation("androidx.datastore:datastore-preferences:1.2.1")
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation 'com.maxkeppeler.sheets-compose-dialogs:core:1.3.0'
    implementation 'com.maxkeppeler.sheets-compose-dialogs:calendar:1.3.0'
    implementation 'com.maxkeppeler.sheets-compose-dialogs:date-time:1.3.0'
    implementation "com.pierfrancescosoffritti.taptargetcompose:core:1.2.1"
    implementation "com.airbnb.android:lottie-compose:6.7.1"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.mikepenz:aboutlibraries-core:15.0.3"
    implementation "com.mikepenz:aboutlibraries-compose-m3:15.0.3"
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}